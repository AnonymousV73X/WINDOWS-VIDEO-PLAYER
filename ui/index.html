<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    NovaPlay v2 — strict CSP. Everything is local, no network calls.
    nova-video:// protocol serves local video files + thumbnails.
    img-src includes blob: + data: for generated thumbnails + blur-up placeholders.
  -->
    
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline';
            font-src 'self';
            img-src 'self' data: blob: nova-video:;
            media-src 'self' blob: nova-video:;
            connect-src 'self';">

  <title>NovaPlay</title>

  <!-- Font preloads — local TTFs, no network -->
  <link rel="preload" href="../assets/fonts/outfit-400.ttf" as="font" type="font/ttf">
  <link rel="preload" href="../assets/fonts/outfit-500.ttf" as="font" type="font/ttf">
  <link rel="preload" href="../assets/fonts/outfit-600.ttf" as="font" type="font/ttf">
  <link rel="preload" href="../assets/fonts/figtree-400.ttf" as="font" type="font/ttf">
  <link rel="preload" href="../assets/fonts/figtree-500.ttf" as="font" type="font/ttf">
  <link rel="preload" href="../assets/fonts/figtree-600.ttf" as="font" type="font/ttf">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/outfit.css">
  <link rel="stylesheet" href="styles/figtree.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- ── Splash screen (NovaTune-style with cycling icons) ── -->
  <div class="splash-screen" id="splash-screen">
    <div class="splash-inner">
      <div class="splash-icon-wrap">
        <div class="splash-icon-glow"></div>
        <!-- Cycling icons — NovaTune pattern: 4 SVG icons fade in/out in rotation -->
        <svg class="splash-cycle-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        <svg class="splash-cycle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>
        </svg>
        <svg class="splash-cycle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <svg class="splash-cycle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="splash-title">NovaPlay</div>
      <div class="splash-subtitle">Loading library…</div>
      <div class="splash-progress-track">
        <div class="splash-progress-fill" id="splash-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- ── TITLEBAR (NovaTune-style: green circle logo with play SVG) ── -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <!-- NovaTune green circle logo with play icon SVG inside -->
      <div class="titlebar-logo" id="titlebar-logo" title="NovaPlay">
        <svg viewBox="0 0 24 24" fill="#000"><polygon points="8,5 19,12 8,19"/></svg>
      </div>
      <div class="titlebar-name">NovaPlay</div>
    </div>
    <div class="titlebar-right">
      <!-- slot reserved for window control buttons (handled by native titleBarOverlay) -->
    </div>
  </div>

  <!-- ── APP BODY ── -->
  <div class="app-body" id="app-body">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main content -->
    <main class="content" id="content">
      <header class="content-header">
        <div class="content-header-text">
          <h1 class="content-title" id="content-title">Library</h1>
          <div class="content-subtitle" id="content-subtitle">No videos yet</div>
        </div>
      </header>
      <div class="video-grid" id="video-grid"></div>
      <div class="empty-state hidden" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/>
        </svg>
        <div class="empty-state-title">No videos in your library</div>
        <div class="empty-state-subtitle">Click "Add folder" in the sidebar to scan for video files</div>
      </div>
    </main>

    <!-- Video screen (full player view, hidden by default) -->
    <section class="video-screen hidden" id="video-screen">
      <div class="video-area" id="video-area">
        <!--
          BUG FIX: The <video> fallback element now has:
            - playsinline attribute (required for iOS/WebKit inline video)
            - webkit-playsinline attribute (legacy iOS support)
            - preload="auto" (tells browser to load video data eagerly)
            - All positioning/display controlled via CSS class `.active`,
              NOT inline styles (which conflicted with CSS `inset:0`)

          CSS handles: display, position, inset, width, height, z-index,
          object-fit, background, video-rendering when `.active` class is set.
        -->
        <video class="video-fallback-element" id="video-fallback-element"
               playsinline webkit-playsinline preload="auto"
               style="background:#000;"></video>
      </div>
      <!-- Player controls overlay (fades in/out on mouse activity) -->
      <div class="player-controls-overlay" id="player-controls-overlay">
        <div class="player-controls-top">
          <div class="player-controls-top-left">
            <button class="player-back-btn" id="player-back-btn" title="Back to library">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>
            <div class="player-video-title" id="player-video-title">No video</div>
          </div>
          <div class="player-controls-top-right">
            <button class="player-icon-btn" id="player-audio-tracks-btn" title="Audio tracks">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </button>
            <button class="player-icon-btn" id="player-subtitle-tracks-btn" title="Subtitles">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="12" x2="23" y2="12"/><line x1="12" y1="16" x2="18" y2="16"/><line x1="6" y1="16" x2="10" y2="16"/></svg>
            </button>
            <button class="player-icon-btn" id="player-chapters-btn" title="Chapters">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </button>
            <button class="player-icon-btn" id="player-settings-btn" title="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            </button>
          </div>
        </div>

        <div class="player-controls-bottom">
          <!-- Glowing progress bar with hover bubble -->
          <div class="progress-bar-wrap" id="progress-bar-wrap">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progress-bar-fill"></div>
              <div class="progress-bar-handle" id="progress-bar-handle"></div>
            </div>
            <div class="progress-bubble" id="progress-bubble">0:00</div>
          </div>
          <div class="progress-time-row">
            <span id="progress-time-current">0:00</span>
            <span id="progress-time-total">0:00</span>
          </div>

          <!-- Bottom controls -->
          <div class="player-controls-row">
            <div class="player-controls-left">
              <div class="volume-control">
                <button class="player-controls-btn" id="player-volume-btn" title="Mute">
                  <!-- Material Design filled volume icon (NovaTune style) -->
                  <svg viewBox="0 0 24 24" id="volume-icon" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <div class="volume-bar-wrap" id="volume-bar-wrap">
                  <div class="volume-bar-track">
                    <div class="volume-bar-fill" id="volume-bar-fill"></div>
                    <div class="volume-bar-handle" id="volume-bar-handle"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="player-controls-center">
              <button class="player-controls-btn" id="player-prev-btn" title="Previous">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
              </button>
              <!-- NovaTune-style play/pause: filled polygon/rect SVGs -->
              <button class="player-play-btn" id="player-play-btn" title="Play/Pause">
                <svg viewBox="0 0 24 24" id="play-icon" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
              </button>
              <button class="player-controls-btn" id="player-next-btn" title="Next">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
              </button>
            </div>
            <div class="player-controls-right">
              <button class="player-controls-btn" id="player-speed-btn" title="Playback speed">1×</button>
              <button class="player-controls-btn" id="player-shuffle-btn" title="Shuffle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              </button>
              <button class="player-controls-btn" id="player-repeat-btn" title="Repeat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              </button>
              <button class="player-icon-btn" id="player-fullscreen-btn" title="Fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Track / subtitle / chapter menu popovers -->
      <div class="track-menu" id="track-menu"></div>
    </section>
  </div>

  <!-- Mini now-playing bar (NovaTune-style with EQ animation bars) -->
  <div class="now-playing-bar hidden" id="now-playing-bar">
    <img class="now-playing-thumb" id="now-playing-thumb" src="" alt="">
    <!-- EQ animation bars (NovaTune-style) -->
    <div class="eq-bars" id="now-playing-eq">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
    <div class="now-playing-info">
      <div class="now-playing-title" id="now-playing-title">No video</div>
      <div class="now-playing-meta" id="now-playing-meta">—</div>
      <div class="now-playing-progress">
        <div class="now-playing-progress-fill" id="now-playing-progress-fill"></div>
      </div>
    </div>
    <div class="now-playing-controls">
      <button class="now-playing-btn" id="now-playing-prev" title="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <!-- NovaTune-style green circle play button -->
      <button class="now-playing-play-btn" id="now-playing-play" title="Play/Pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <button class="now-playing-btn" id="now-playing-next" title="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="now-playing-expand" id="now-playing-expand" title="Expand to full player">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </div>

  <!-- Settings overlay (NovaTune-style dark glass panel) -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel" id="settings-panel">
      <!-- Populated dynamically by SettingsPanel.js -->
    </div>
  </div>

  <!-- Tooltip element (single, reused) -->
  <div class="tooltip" id="tooltip"></div>

  <!-- Renderer entry -->
  <script src="renderer.js"></script>
  <!-- UI components (in dependency order) -->
  <script src="components/Utils.js"></script>
  <script src="components/VirtualList.js"></script>
  <script src="components/Sidebar.js"></script>
  <script src="components/LibraryView.js"></script>
  <script src="components/VideoScreen.js"></script>
  <script src="components/PlayerControls.js"></script>
  <script src="components/NowPlayingBar.js"></script>
  <script src="components/SettingsPanel.js"></script>
  <script src="components/TrackMenu.js"></script>
</body>
</html>
